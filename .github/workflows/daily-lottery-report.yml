name: Daily lottery report

on:
  schedule:
    # 08:00 Australia/Sydney ≈ 22:00 UTC (AEST); AEDT ≈ 09:00 Sydney
    - cron: "0 22 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Prepare application.properties from example
        run: |
          cp src/main/resources/application.properties.example \
             src/main/resources/application.properties

      - name: Run daily pipeline (once)
        env:
          SPRING_DATASOURCE_URL: ${{ secrets.SPRING_DATASOURCE_URL }}
          SPRING_DATASOURCE_USERNAME: ${{ secrets.SPRING_DATASOURCE_USERNAME }}
          SPRING_DATASOURCE_PASSWORD: ${{ secrets.SPRING_DATASOURCE_PASSWORD }}
          SPRING_MAIL_USERNAME: ${{ secrets.SPRING_MAIL_USERNAME }}
          SPRING_MAIL_PASSWORD: ${{ secrets.SPRING_MAIL_PASSWORD }}
          EMAIL_SEND_TO: ${{ secrets.EMAIL_SEND_TO }}
        run: mvn -B -e compile exec:java -Dexec.cleanupDaemonThreads=false
